[project]
name = "ai-powered-threat-detection"
version = "1.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "Flask==3.0.3",
    "flask-cors==4.0.1",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "gunicorn==22.0.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
    "transformers==4.41.2",
    "accelerate==0.31.0",
    "safetensors==0.4.3",
    "torch==2.3.1"
]

[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
